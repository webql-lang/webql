name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v, e.g. 0.1.0-alpha.1"
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}

jobs:
  github-release:
    runs-on: ubuntu-24.04

    env:
      TAG: v${{ inputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"
          gleam-version: "1.16.0"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            build
          key: ${{ runner.os }}-release-1.17-27-${{ hashFiles('mix.lock', 'manifest.toml') }}
          restore-keys: |
            ${{ runner.os }}-release-1.17-27-

      - name: Release
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Releases must be cut from main"
            exit 1
          fi

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Release requires a clean working tree"
            exit 1
          fi

          mix_version="$(mix eval --no-compile --no-deps-check 'Mix.Project.config()[:version] |> IO.write()')"
          gleam_version="$(awk -F '"' '/^version = / { print $2; exit }' gleam.toml)"

          if [ "${mix_version}" != "${{ inputs.version }}" ] || [ "${gleam_version}" != "${{ inputs.version }}" ]; then
            echo "Input version ${{ inputs.version }} must match mix.exs (${mix_version}) and gleam.toml (${gleam_version})"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists"
            exit 1
          fi

          gleam deps download
          mix deps.get
          gleam test

          rm -rf build/prod/erlang
          gleam export erlang-shipment
          rm -f build/prod/erlang/*/_gleam_artefacts/gleam@@compile.erl

          MIX_ENV=prod mix compile --warnings-as-errors
          MIX_ENV=test mix test

          git config user.name "webql-release-bot"
          git config user.email "webql-release-bot@users.noreply.github.com"
          git add -f build/prod/erlang

          if git diff --cached --quiet -- build/prod/erlang; then
            echo "No Gleam build artifacts were staged"
            exit 1
          fi

          git commit -m "Release ${TAG}"
          git tag "${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${TAG}" --verify-tag --generate-notes
