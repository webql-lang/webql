name: release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  github-release:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"
          gleam-version: "1.16.0"

      - name: Build, tag, and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(mix eval --no-compile --no-deps-check 'Mix.Project.config()[:version] |> IO.write()')"
          TAG="v${VERSION}"

          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(grep '^version =' gleam.toml | cut -d '"' -f2)" = "${VERSION}"

          gleam deps download
          mix deps.get

          gleam test
          MIX_ENV=test mix test

          rm -rf build/prod/erlang
          gleam export erlang-shipment
          rm -f build/prod/erlang/*/_gleam_artefacts/gleam@@compile.erl

          MIX_ENV=prod mix compile --warnings-as-errors

          git config user.name "webql-release-bot"
          git config user.email "webql-release-bot@users.noreply.github.com"

          git add -f build/prod/erlang
          git commit -m "Release ${TAG}"
          git tag "${TAG}"
          git push origin "${TAG}"

          gh release create "${TAG}" --verify-tag --generate-notes
