name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  github-release:
    runs-on: ubuntu-24.04

    env:
      MIX_ENV: prod

    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v3

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"
          gleam-version: "1.16.0"

      - uses: actions/cache@v4
        with:
          path: |
            packages/webql-elixir/deps
            packages/webql-elixir/_build
          key: ${{ runner.os }}-release-1.17-27-${{ hashFiles('packages/webql-elixir/mix.lock', 'packages/webql/manifest.toml') }}
          restore-keys: |
            ${{ runner.os }}-release-1.17-27-

      - name: Build system artifact
        run: |
          just webql deps
          just webql compile

      - name: Install dependencies
        run: just webql-elixir deps

      - name: Check formatting
        run: just webql-elixir format-check

      - name: Compile
        run: just webql-elixir compile

      - name: Run tests
        run: MIX_ENV=test just webql-elixir test

      - name: Run dialyzer
        run: just webql-elixir dialyzer

      - name: Stage release source
        run: |
          package="webql-${GITHUB_REF_NAME}"
          stage="${RUNNER_TEMP}/${package}"

          mkdir -p "${stage}"
          rsync -a --exclude-from=packages/webql-elixir/.gitignore packages/webql-elixir/ "${stage}/"
          cp LICENSE README.md "${stage}/"

          mkdir -p "${stage}/src"
          rsync -a \
            --exclude="*_test.erl" \
            --include="*/" \
            --include="*.erl" \
            --exclude="*" \
            packages/webql/build/dev/erlang/webql/_gleam_artefacts/ \
            "${stage}/src/"

          tar -czf "${GITHUB_WORKSPACE}/${package}.tar.gz" -C "${RUNNER_TEMP}" "${package}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: webql-${{ github.ref_name }}.tar.gz
