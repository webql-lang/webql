name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v, e.g. 0.1.0-alpha.1"
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}

jobs:
  github-release:
    runs-on: ubuntu-24.04

    env:
      TAG: v${{ inputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"
          gleam-version: "1.16.0"

      - name: Check release ref
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Releases must be run from main, got ${GITHUB_REF}"
            exit 1
          fi

      - name: Check release version
        run: |
          mix_version="$(mix eval --no-compile --no-deps-check 'Mix.Project.config()[:version] |> IO.write()')"
          gleam_version="$(awk -F '"' '/^version = / { print $2; found = 1; exit } END { if (!found) exit 1 }' gleam.toml)"

          if [ "${mix_version}" != "${{ inputs.version }}" ]; then
            echo "Input version ${{ inputs.version }} does not match Mix package version ${mix_version}"
            exit 1
          fi

          if [ "${gleam_version}" != "${{ inputs.version }}" ]; then
            echo "Input version ${{ inputs.version }} does not match Gleam package version ${gleam_version}"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists"
            exit 1
          fi

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            build
          key: ${{ runner.os }}-release-1.17-27-${{ hashFiles('mix.lock', 'manifest.toml') }}
          restore-keys: |
            ${{ runner.os }}-release-1.17-27-

      - name: Install dependencies
        run: |
          gleam deps download
          mix deps.get

      - name: Run Gleam tests
        run: gleam test

      - name: Build Gleam artifacts
        run: |
          rm -rf build/prod/erlang
          gleam export erlang-shipment
          rm -f build/prod/erlang/*/_gleam_artefacts/gleam@@compile.erl

      - name: Compile Mix package
        run: MIX_ENV=prod mix compile --warnings-as-errors

      - name: Run Elixir tests
        run: MIX_ENV=test mix test

      - name: Create release commit
        run: |
          git config user.name "webql-release-bot"
          git config user.email "webql-release-bot@users.noreply.github.com"

          git add -f build/prod/erlang

          if git diff --cached --quiet -- build/prod/erlang; then
            echo "No Gleam build artifacts were staged"
            exit 1
          fi

          git commit -m "Release ${TAG}"
          git tag "${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${TAG}" --verify-tag --generate-notes

      - name: Publish Hex package
        if: ${{ vars.PUBLISH_HEX == 'true' }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: MIX_ENV=prod mix hex.publish --yes
