name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  github-release:
    runs-on: ubuntu-24.04

    env:
      MIX_ENV: prod

    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v3

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"
          gleam-version: "1.16.0"

      - uses: actions/cache@v4
        with:
          path: |
            platform/elixir/deps
            platform/elixir/_build
          key: ${{ runner.os }}-release-1.17-27-${{ hashFiles('platform/elixir/mix.lock', 'system/manifest.toml') }}
          restore-keys: |
            ${{ runner.os }}-release-1.17-27-

      - name: Build system artifact
        run: |
          just system clean
          just system deps download
          just system build --target erlang

      - name: Install dependencies
        run: just platform-elixir deps.get

      - name: Check formatting
        run: just platform-elixir format --check-formatted

      - name: Compile
        run: just platform-elixir compile --warnings-as-errors

      - name: Run tests
        run: MIX_ENV=test just platform-elixir test

      - name: Run dialyzer
        run: just platform-elixir dialyzer

      - name: Stage release source
        run: |
          package="webql-${GITHUB_REF_NAME}"
          stage="${RUNNER_TEMP}/${package}"

          mkdir -p "${stage}"
          tar \
            --exclude="./_build" \
            --exclude="./cover" \
            --exclude="./deps" \
            --exclude="./doc" \
            --exclude="./tmp" \
            -C platform/elixir \
            -cf - . | tar -x -C "${stage}"
          cp LICENSE README.md "${stage}/"
          mkdir -p "${stage}/src/webql/engine"
          cp system/build/dev/erlang/webql/_gleam_artefacts/*.erl "${stage}/src/"
          cp system/build/dev/erlang/webql/_gleam_artefacts/webql/engine/basic_ffi.erl "${stage}/src/webql/engine/"
          rm -f "${stage}"/src/*_test.erl

          tar -czf "${GITHUB_WORKSPACE}/${package}.tar.gz" -C "${RUNNER_TEMP}" "${package}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: webql-${{ github.ref_name }}.tar.gz
