name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  github-release:
    runs-on: ubuntu-24.04

    env:
      MIX_ENV: prod
      RELEASE_PACKAGE: webql_ex-${{ github.ref_name }}
      RELEASE_STAGE: ${{ runner.temp }}/webql_ex-${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v3

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"
          gleam-version: "1.16.0"

      - uses: actions/cache@v4
        with:
          path: |
            packages/webql-elixir/deps
            packages/webql-elixir/_build
          key: ${{ runner.os }}-release-1.17-27-${{ hashFiles('packages/webql-elixir/mix.lock', 'packages/webql/manifest.toml') }}
          restore-keys: |
            ${{ runner.os }}-release-1.17-27-

      - name: Build system artifact
        run: |
          just webql deps
          just webql compile

      - name: Install dependencies
        run: just webql-elixir deps

      - name: Check formatting
        run: just webql-elixir format-check

      - name: Compile
        run: just webql-elixir compile

      - name: Run tests
        run: MIX_ENV=test just webql-elixir test

      - name: Run dialyzer
        run: just webql-elixir dialyzer

      - name: Check package version
        working-directory: packages/webql-elixir
        run: |
          version="$(mix run -e 'Mix.Project.config()[:version] |> IO.write()')"

          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Mix package version v${version}"
            exit 1
          fi

      - name: Stage release source
        run: |
          mkdir -p "${RELEASE_STAGE}"
          rsync -a --exclude-from=packages/webql-elixir/.gitignore packages/webql-elixir/ "${RELEASE_STAGE}/"
          cp LICENSE README.md "${RELEASE_STAGE}/"

          mkdir -p "${RELEASE_STAGE}/src"
          rsync -a \
            --exclude="*_test.erl" \
            --include="*/" \
            --include="*.erl" \
            --exclude="*" \
            packages/webql/build/dev/erlang/webql/_gleam_artefacts/ \
            "${RELEASE_STAGE}/src/"

          tar -czf "${GITHUB_WORKSPACE}/${RELEASE_PACKAGE}.tar.gz" -C "${RUNNER_TEMP}" "${RELEASE_PACKAGE}"

      - name: Publish Hex package
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          MIX_ENV: dev
        run: |
          cd "${RELEASE_STAGE}"
          mix deps.get
          mix hex.publish --yes

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.RELEASE_PACKAGE }}.tar.gz
