name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - "guides/**"
  pull_request:
    paths-ignore:
      - "guides/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gleam:
    name: gleam ${{ matrix.gleam }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - gleam: "1.16.0"

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: ${{ matrix.gleam }}
          rebar3-version: "3"

      - run: gleam deps download
      - run: gleam test
      - run: gleam format --check src test

  mix:
    name: elixir ${{ matrix.elixir }} / otp ${{ matrix.otp }}
    runs-on: ubuntu-24.04

    env:
      MIX_ENV: test

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.17"
            otp: "27"
          - elixir: "1.18"
            otp: "27"
            lint: true

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
          gleam-version: "1.16.0"

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            build
          key: ${{ runner.os }}-elixir-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock', 'manifest.toml', 'gleam.toml') }}
          restore-keys: |
            ${{ runner.os }}-elixir-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: just deps

      - name: Check formatting
        if: ${{ matrix.lint }}
        run: just format-check

      - name: Run tests
        run: just test

      - name: Run dialyzer
        if: ${{ matrix.lint }}
        run: mix dialyzer
