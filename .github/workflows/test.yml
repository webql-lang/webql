name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - "guides/**"
  pull_request:
    paths-ignore:
      - "guides/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  webql:
    name: webql (gleam ${{ matrix.gleam }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - gleam: "1.16.0"

    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v3

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.16.0"
          rebar3-version: "3"
          elixir-version: "1"

      - run: just webql deps
      - run: just webql test
      - run: just webql format-check

  webql-elixir:
    name: webql-elixir (elixir ${{ matrix.elixir }} / otp ${{ matrix.otp }})
    runs-on: ubuntu-24.04

    env:
      MIX_ENV: test

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.17"
            otp: "27"
          - elixir: "1.18"
            otp: "27"
            lint: true

    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v3

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
          gleam-version: "1.16.0"

      - uses: actions/cache@v4
        with:
          path: |
            packages/webql-elixir/deps
            packages/webql-elixir/_build
          key: ${{ runner.os }}-elixir-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('packages/webql-elixir/mix.lock', 'packages/webql/manifest.toml') }}
          restore-keys: |
            ${{ runner.os }}-elixir-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Build system artifact
        run: |
          just webql clean
          just webql deps
          just webql compile

      - name: Install dependencies
        run: just webql-elixir deps

      - name: Check formatting
        if: ${{ matrix.lint }}
        run: just webql-elixir format-check

      - name: Compile
        run: just webql-elixir compile

      - name: Run tests
        run: just webql-elixir test

      - name: Run dialyzer
        if: ${{ matrix.lint }}
        run: just webql-elixir dialyzer
